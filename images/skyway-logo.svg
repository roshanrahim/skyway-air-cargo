<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" role="img" aria-label="SKYWAY Air Cargo and Courier Services logo">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E30613" stop-opacity="0"/>
      <stop offset="1" stop-color="#E30613"/>
