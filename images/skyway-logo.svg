    <path fill="#E30613" d="M22.12 9.64c-.21-.8-1.04-1.28-1.84-1.06l-5.31 1.42-6.46-6.02-1.93.51 3.87 6.7-4.97 1.33-1.84-1.45-1.45.39 1.82 3.16.77 1.33 1.6-.43 5.31-1.42 4.35-1.16 5.02-1.35c.8-.22 1.27-1.04 1.06-1.95z"/>
  </g>
