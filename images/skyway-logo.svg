  <!-- subtitle -->
  <text x="18" y="112" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#141C2B" letter-spacing="3.2">AIR CARGO &amp; COURIER SERVICES</text>
